[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-analysis"
version = "0.1.0"
description = "ScholarAnalysis MCP — paper download, parse, and LLM-focused extraction"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["scholar_analysis*"]

[project.scripts]
scholar-analysis = "scholar_analysis.main:main"
